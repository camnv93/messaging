<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Structure Toolkit (Big Endian)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; margin: 20px; background-color: #f0f2f5; color: #333; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #1a73e8; border-bottom: 2px solid #1a73e8; padding-bottom: 10px; }
        h3 { color: #5f6368; margin-top: 25px; }
        
        .section { background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #e0e0e0; margin-bottom: 30px; }
        
        /* Grid Layout cho Generator */
        .gen-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .input-item { display: flex; flex-direction: column; }
        .input-item label { font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #555; }
        input, textarea { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-family: monospace; }
        
        button { background-color: #1a73e8; color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        button:hover { background-color: #1557b0; }
        button.secondary { background-color: #34a853; }

        .output-box { margin-top: 15px; padding: 15px; background: #202124; color: #00ff00; border-radius: 6px; word-break: break-all; font-family: 'Courier New', monospace; min-height: 40px; border: 2px solid #000; }

        table { width: 100%; border-collapse: collapse; background: white; font-size: 14px; margin-top: 10px; }
        table, th, td { border: 1px solid #e0e0e0; }
        th { background-color: #f1f3f4; padding: 10px; text-align: left; }
        td { padding: 10px; }
        .highlight { color: #d93025; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Message Structure Toolkit (Big Endian)</h2>

    <!-- SECTION 1: GENERATOR -->
    <div class="section">
        <h3>1. Tạo chuỗi Hex (Generator)</h3>
        <div class="gen-grid">
            <div class="input-item">
                <label>Magic (uint16)</label>
                <input type="text" id="g_magic" value="A5A5">
            </div>
            <div class="input-item">
                <label>Version (uint8)</label>
                <input type="number" id="g_ver" value="1">
            </div>
            <div class="input-item">
                <label>Header Checksum (uint8)</label>
                <input type="number" id="g_h_sum" value="0">
            </div>
            <div class="input-item">
                <label>Msg Type (uint8)</label>
                <input type="number" id="g_type" value="0">
            </div>
            <div class="input-item">
                <label>TTL (uint8)</label>
                <input type="number" id="g_ttl" value="8">
            </div>
            <div class="input-item">
                <label>Flags (uint16)</label>
                <input type="number" id="g_flags" value="0">
            </div>
            <div class="input-item">
                <label>Event Type (uint16)</label>
                <input type="number" id="g_event" value="0">
            </div>
            <div class="input-item">
                <label>Source ID (uint16)</label>
                <input type="number" id="g_src" value="0">
            </div>
            <div class="input-item">
                <label>Dest ID (uint16)</label>
                <input type="number" id="g_dest" value="0">
            </div>
            <div class="input-item" style="grid-column: span 2;">
                <label>Payload Hex (Để trống nếu null)</label>
                <input type="text" id="g_payload" placeholder="Ví dụ: 11 22 AA BB">
            </div>
            <div class="input-item">
                <label>Payload Checksum (uint32)</label>
                <input type="number" id="g_p_sum" value="0">
            </div>
        </div>
        <button class="secondary" onclick="generateHex()">Tạo chuỗi Hex ↓</button>
        <div class="output-box" id="genOutput">Chuỗi Hex sẽ xuất hiện ở đây...</div>
    </div>

    <!-- SECTION 2: ANALYZER -->
    <div class="section">
        <h3>2. Phân tích chuỗi Hex (Analyzer)</h3>
        <textarea id="hexInput" placeholder="Dán chuỗi hex cần phân tích vào đây..."></textarea>
        <button onclick="analyzeMessage()">Phân Tích Dữ Liệu</button>

        <div id="result" style="display:none;">
            <table>
                <thead>
                    <tr><th>Trường</th><th>Offset</th><th>Kiểu</th><th>Hex (BE)</th><th>Dec</th></tr>
                </thead>
                <tbody id="headerBody"></tbody>
            </table>
            <p><strong>Payload:</strong></p>
            <div class="output-box" id="payloadDisplay" style="color: #34a853;"></div>
            <p><strong>Payload Checksum:</strong> <span class="highlight" id="payloadChecksum"></span></p>
        </div>
    </div>
</div>

<script>
    // --- HELPER FUNCTIONS ---
    function toHex(val, bytes) {
        return val.toString(16).toUpperCase().padStart(bytes * 2, '0');
    }

    function hexToBytes(hex) {
        hex = hex.replace(/[^0-9A-Fa-f]/g, '');
        let res = [];
        for (let i = 0; i < hex.length; i += 2) res.push(parseInt(hex.substr(i, 2), 16));
        return res;
    }

    // --- GENERATOR LOGIC ---
    function generateHex() {
        try {
            let hex = "";
            // Header
            hex += toHex(parseInt(document.getElementById('g_magic').value, 16), 2);
            hex += toHex(parseInt(document.getElementById('g_ver').value), 1);
            hex += toHex(parseInt(document.getElementById('g_h_sum').value), 1);
            hex += toHex(parseInt(document.getElementById('g_type').value), 1);
            hex += toHex(parseInt(document.getElementById('g_ttl').value), 1);
            hex += toHex(parseInt(document.getElementById('g_flags').value), 2);
            hex += toHex(parseInt(document.getElementById('g_event').value), 2);
            hex += toHex(parseInt(document.getElementById('g_src').value), 2);
            hex += toHex(parseInt(document.getElementById('g_dest').value), 2);
            
            // Tính toán payload
            let pRaw = document.getElementById('g_payload').value.replace(/\s+/g, '');
            let pBytes = hexToBytes(pRaw);
            hex += toHex(pBytes.length, 2); // Payload Size field
            
            // Thêm Payload
            hex += pRaw.toUpperCase();
            
            // Checksum
            hex += toHex(parseInt(document.getElementById('g_p_sum').value), 4);

            document.getElementById('genOutput').innerText = hex.match(/.{1,2}/g).join(' ');
        } catch(e) {
            alert("Lỗi nhập liệu: Hãy kiểm tra các giá trị số!");
        }
    }

    // --- ANALYZER LOGIC ---
    function analyzeMessage() {
        let rawHex = document.getElementById('hexInput').value.replace(/[^0-9A-Fa-f]/g, '');
        if (rawHex.length < 40) { alert("Dữ liệu quá ngắn!"); return; }

        const b = new Uint8Array(rawHex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
        const read16 = (i) => (b[i] << 8) | b[i+1];
        const read32 = (i) => ((b[i] << 24) | (b[i+1] << 16) | (b[i+2] << 8) | b[i+3]) >>> 0;

        const fields = [
            ["Magic", 0, 2, "uint16"], ["Version", 2, 1, "uint8"], ["H-Checksum", 3, 1, "uint8"],
            ["Msg Type", 4, 1, "uint8"], ["TTL", 5, 1, "uint8"], ["Flags", 6, 2, "uint16"],
            ["Event Type", 8, 2, "uint16"], ["Source", 10, 2, "uint16"], ["Dest", 12, 2, "uint16"],
            ["Payload Size", 14, 2, "uint16"]
        ];

        let html = "", pSize = 0;
        fields.forEach(f => {
            let val = (f[2] === 1) ? b[f[1]] : read16(f[1]);
            if (f[0] === "Payload Size") pSize = val;
            html += `<tr><td>${f[0]}</td><td>${f[1]}</td><td>${f[3]}</td><td class="highlight">0x${toHex(val, f[2])}</td><td>${val}</td></tr>`;
        });

        document.getElementById('headerBody').innerHTML = html;
        let pEnd = 16 + pSize;
        let payloadHex = Array.from(b.slice(16, pEnd)).map(x => toHex(x,1)).join(' ');
        document.getElementById('payloadDisplay').innerText = payloadHex || "(Null)";
        
        let cSum = read32(pEnd);
        document.getElementById('payloadChecksum').innerText = "0x" + toHex(cSum, 4) + ` (${cSum})`;
        document.getElementById('result').style.display = 'block';
    }
</script>

</body>
</html>
