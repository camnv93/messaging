<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Dynamic TLV Visual Tree Viewer</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; padding: 20px; color: #1a1a1b; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        h2 { color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-top: 0; }
        
        /* Cấu hình linh hoạt */
        .config-bar { display: flex; gap: 20px; background: #f8fafc; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .config-group { display: flex; flex-direction: column; }
        .config-group label { font-size: 12px; font-weight: bold; color: #64748b; margin-bottom: 5px; text-transform: uppercase; }
        select { padding: 8px; border-radius: 4px; border: 1px solid #cbd5e1; outline: none; }

        textarea { width: 100%; height: 100px; padding: 15px; border: 2px solid #e2e8f0; border-radius: 8px; font-family: 'Fira Code', monospace; font-size: 14px; box-sizing: border-box; transition: border-color 0.3s; }
        textarea:focus { border-color: #3b82f6; outline: none; }
        
        button { background: #3b82f6; color: white; border: none; padding: 12px 30px; border-radius: 6px; cursor: pointer; font-weight: 600; margin-top: 15px; box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3); }
        button:hover { background: #2563eb; transform: translateY(-1px); }

        #tree { margin-top: 30px; }
        .node { margin-left: 35px; border-left: 2px solid #e2e8f0; padding-left: 20px; margin-top: 12px; position: relative; }
        .node::before { content: ""; position: absolute; top: 18px; left: 0; width: 18px; height: 2px; background: #e2e8f0; }
        
        .box { display: inline-flex; align-items: center; padding: 6px 12px; border-radius: 4px; font-size: 13px; margin-right: 8px; font-family: monospace; }
        .tag { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; font-weight: bold; }
        .len { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .val { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; word-break: break-all; max-width: 100%; }
        
        .error { color: #dc2626; background: #fee2e2; padding: 15px; border-radius: 6px; margin-top: 20px; display: none; border: 1px solid #fecaca; }
        .badge { font-size: 10px; margin-right: 5px; opacity: 0.7; }
    </style>
</head>
<body>

<div class="container">
    <h2>Dynamic TLV Explorer</h2>
    
    <div class="config-bar">
        <div class="config-group">
            <label>Tag Size (Bytes)</label>
            <select id="tagSize">
                <option value="1">1 Byte (00)</option>
                <option value="2" selected>2 Bytes (0000)</option>
                <option value="4">4 Bytes (00000000)</option>
            </select>
        </div>
        <div class="config-group">
            <label>Length Size (Bytes)</label>
            <select id="lenSize">
                <option value="1">1 Byte (Max 255)</option>
                <option value="2">2 Bytes (Max 65k)</option>
                <option value="4" selected>4 Bytes (Max 4GB)</option>
            </select>
        </div>
    </div>

    <textarea id="hexInput" placeholder="Dán chuỗi Hex vào đây...">a1a100000019a2a200000013a3a30000000da4a400000007c1c10000000101</textarea>
    <button onclick="parseTLV()">Phân Tích Cấu Trúc</button>

    <div id="error" class="error"></div>
    <div id="tree"></div>
</div>

<script>
function parseTLV() {
    const input = document.getElementById('hexInput').value.replace(/[^0-9a-fA-F]/g, '').toLowerCase();
    const tagSize = parseInt(document.getElementById('tagSize').value);
    const lenSize = parseInt(document.getElementById('lenSize').value);
    
    const treeContainer = document.getElementById('tree');
    const errorContainer = document.getElementById('error');
    
    treeContainer.innerHTML = '';
    errorContainer.style.display = 'none';

    if (!input) return;

    try {
        if (input.length % 2 !== 0) throw "Chuỗi Hex có độ dài lẻ, không thể tạo thành Byte.";
        const data = hexToBytes(input);
        const result = processTLV(data, 0, data.length, tagSize, lenSize);
        treeContainer.appendChild(renderTree(result));
    } catch (e) {
        errorContainer.innerText = "Lỗi: " + e;
        errorContainer.style.display = 'block';
    }
}

function hexToBytes(hex) {
    let bytes = [];
    for (let c = 0; c < hex.length; c += 2) bytes.push(parseInt(hex.substr(c, 2), 16));
    return bytes;
}

function readInt(data, start, size) {
    let val = 0;
    for (let i = 0; i < size; i++) {
        val = (val << 8) | data[start + i];
    }
    return val >>> 0;
}

function processTLV(data, start, end, tSize, lSize) {
    let nodes = [];
    let i = start;
    const headerSize = tSize + lSize;

    while (i < end) {
        if (i + headerSize > end) {
            // Dữ liệu còn sót lại không đủ tạo Header
            break; 
        }
        
        let tag = readInt(data, i, tSize).toString(16).toUpperCase().padStart(tSize * 2, '0');
        let len = readInt(data, i + tSize, lSize);
        
        let vStart = i + headerSize;
        let vEnd = vStart + len;

        if (vEnd > end) {
            throw `Tag 0x${tag} khai báo dài ${len} bytes nhưng buffer chỉ còn ${end - vStart} bytes. Hãy kiểm tra lại cấu hình Tag/Length Size.`;
        }

        let valueHex = data.slice(vStart, vEnd).map(b => b.toString(16).padStart(2, '0')).join(' ');
        
        let children = [];
        // Điều kiện đệ quy: Nếu bên trong chứa ít nhất 1 TLV hợp lệ
        if (len >= headerSize) {
            try {
                // Thử parse nội dung bên trong, nếu thành công thì coi là con
                let temp = processTLV(data, vStart, vEnd, tSize, lSize);
                if (temp.length > 0) children = temp;
            } catch(e) { children = []; }
        }

        nodes.push({ tag, len, valueHex, children });
        i = vEnd;
    }
    return nodes;
}

function renderTree(nodes) {
    let fragment = document.createDocumentFragment();
    nodes.forEach(node => {
        let div = document.createElement('div');
        div.className = 'node';
        div.innerHTML = `
            <div>
                <span class="box tag"><span class="badge">TAG</span>0x${node.tag}</span>
                <span class="box len"><span class="badge">LEN</span>${node.len}</span>
                ${node.children.length === 0 ? `<span class="box val">${node.valueHex || '(empty)'}</span>` : ''}
            </div>
        `;
        if (node.children.length > 0) {
            div.appendChild(renderTree(node.children));
        }
        fragment.appendChild(div);
    });
    return fragment;
}

// Khởi chạy
parseTLV();
</script>

</body>
</html>
